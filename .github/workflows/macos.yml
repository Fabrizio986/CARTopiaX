name: macOS

# Experimental: builds BioDynaMo from source on macOS, then CARTopiaX.
# Runs on pushes to macos-ci, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [macos-ci]

env:
  BDM_TAG: v1.05-cr-20260812-01   # same tag the Linux recipe pins

jobs:
  build:
    name: macos-15-apple-clang
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: brew install libomp open-mpi python@3.9 wget cmake ninja bash tbb qt@5

      # BioDynaMo's CMakeLists.txt expands a cache variable unquoted inside an
      # if(), which a CMake 4 configure rejects, so use an older CMake.
      - name: Pin CMake
        run: |
          python3.9 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/pip" install cmake==3.31.6
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cmake-venv/bin/cmake" --version

      - name: Build BioDynaMo
        run: |
          git clone --depth 1 -b "$BDM_TAG" https://github.com/vgvassilev/biodynamo "$RUNNER_TEMP/biodynamo"
          cmake -S "$RUNNER_TEMP/biodynamo" -B "$RUNNER_TEMP/bdm-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DNOPYENV=YES -Dnuma=OFF \
            -Dnotebooks=OFF -Dparaview=OFF -Dlibgit2=OFF -Dsbml=OFF
          cmake --build "$RUNNER_TEMP/bdm-build"

      - name: Build and test CARTopiaX
        run: |
          source "$RUNNER_TEMP/bdm-build/bin/thisbdm.sh"
          cmake . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          ctest --test-dir build --output-on-failure
